<svg xmlns="http://www.w3.org/2000/svg" width="740" height="450" viewBox="0 0 740 450" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Illustrative cyber exposure map</title>
<desc id="desc">Five zones connect a threat source on the internet to a public application, identity, user endpoint, shared service, data store and business system. An orange line marks one possible attack path. This hypothetical scenario is not a live assessment or a verified finding.</desc>
